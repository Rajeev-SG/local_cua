name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: uv venv --python 3.12 .venv
      - name: Install test deps
        run: uv pip install --python .venv/bin/python pytest numpy
      - name: Parser + metrics unit tests
        run: .venv/bin/python -m pytest tests/ -q
      - name: Byte-compile harness
        run: .venv/bin/python -m compileall -q harness
